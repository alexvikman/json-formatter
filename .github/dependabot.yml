version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised version is likely
    # to be withdrawn first. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # One pull request for compatible updates; major versions stay separate.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
